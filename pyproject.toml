[project]
name = "pdf-to-markdown"
version = "0.1.0"
description = "Extract markdown-formatted content from PDF files"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyMuPDF",
    "pdfplumber",
    "pytesseract",
    "opencv-python",
    "numpy",
    "transformers",
    "torch",
    "Pillow",
    "PyYAML",
]

[dependency-groups]
dev = []
